[project]
name = "assetwatch"
version = "0.1.0"
description = "Predictive maintenance for a fleet of assets: 30-day failure risk for ~300,000 real data-center hard drives (Backblaze), compared with the standard SMART rule under a replacement budget, served by a REST API that plans work orders"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "scikit-learn>=1.5", "fastapi>=0.115",
                "uvicorn>=0.30", "joblib>=1.4", "matplotlib>=3.8"]

[project.scripts]
assetwatch = "assetwatch.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
